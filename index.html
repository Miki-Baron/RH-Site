<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>רמת הדסה – מחשוב</title>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#1c2330;--mut:#667085;--line:#e3e7ee;--acc:#1f6feb;--accbg:#e8f0fe;--side:#0f1b2d;--sideink:#c9d4e5;--hl:#fff3b0}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--mut:#8b949e;--line:#2a313c;--acc:#58a6ff;--accbg:#1c2a40;--side:#090d13;--sideink:#9fb0c8;--hl:#5a4b00}}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
/* gate */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#gate form{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
#gate h1{margin:0 0 4px;font-size:20px}
#gate p{margin:0 0 16px;color:var(--mut);font-size:13px}
#pw{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:16px;background:var(--bg);color:var(--ink);direction:ltr;text-align:left}
#err{color:#d93025;font-size:13px;min-height:18px;margin:6px 0}
.rem{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mut);margin:4px 0 12px}
#app{display:none}
body.open #gate{display:none}
body.open #app{display:block}
/* app */
.app{display:flex;min-height:100vh}
aside{width:250px;flex:none;background:var(--side);color:var(--sideink);position:sticky;top:0;height:100vh;overflow:auto;padding:18px 12px}
aside h1{font-size:17px;color:#fff;margin:0 6px 4px}
aside .sub{font-size:12px;margin:0 6px 14px;opacity:.7}
.ng{font-size:11px;letter-spacing:.06em;opacity:.55;margin:16px 6px 6px}
aside a{display:block;color:inherit;text-decoration:none;padding:7px 10px;border-radius:7px;font-size:14px}
aside a:hover{background:rgba(255,255,255,.07)}
aside a.on{background:var(--acc);color:#fff}
main{flex:1;min-width:0;padding:18px 24px 60px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:15px}
button{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-size:14px}
button:hover{border-color:var(--acc)}
.pri,#rv.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#cnt{color:var(--mut);font-size:13px}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:22px;display:none}
section.active{display:block}
body.searching section.hit{display:block}
body.searching section.active:not(.hit){display:none}
.sh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.sh h2{margin:0;font-size:18px}
.tg{font-size:13px;color:var(--mut);cursor:pointer}
.tw{overflow:auto;max-height:78vh}
table{border-collapse:collapse;width:100%}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top;max-width:420px;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext;text-align:right}
td:empty{padding:0 4px}
tr:first-child td{background:var(--accbg);font-weight:600;position:sticky;top:0}
tr:hover td{background:rgba(127,127,127,.06)}
tr.free{display:none}
section.showfree tr.free{display:table-row;opacity:.45}
body.searching tr.nomatch{display:none}
body.searching tr.free.match{display:table-row}
td.sec{filter:blur(5px);cursor:pointer;user-select:none}
td.sec.open,body.reveal td.sec{filter:none;user-select:text;background:rgba(31,111,235,.06)}
td a{color:var(--acc)}
mark{background:var(--hl);color:inherit;border-radius:3px}
#menu{display:none}
@media (max-width:820px){
 .app{display:block}
 aside{position:fixed;inset:0 0 0 auto;width:80%;max-width:300px;z-index:20;transform:translateX(100%);transition:transform .2s;height:100vh}
 aside.open{transform:none}
 #menu{display:inline-block}
 main{padding:10px 16px 60px}
}
@media print{aside,.top{display:none}section{display:block!important;break-inside:avoid}.tw{max-height:none}td.sec{filter:none}}
</style>
</head>

  <button class="pri" type="submit" style="width:100%">כניסה</button>
</form></div>

const HEB=/[֐-׿]/,pw=document.getElementById('pw'),err=document.getElementById('err');
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function hint(e){if(HEB.test(pw.value))err.textContent='⚠️ המקלדת בעברית – עבור לאנגלית';else if(e&&e.getModifierState&&e.getModifierState('CapsLock'))err.textContent='⚠️ Caps Lock דלוק';else err.textContent=''}
pw.addEventListener('input',hint);pw.addEventListener('keyup',hint);
async function open_(p){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const d=b64(BLOB);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(0,12)},key,d.slice(12)));
}
async function unlock(e){
  if(e)e.preventDefault();
  if(HEB.test(pw.value)){err.textContent='⚠️ המקלדת בעברית – עבור לאנגלית והקלד שוב';pw.select();return}
  if(!window.crypto||!crypto.subtle){err.textContent='הדפדפן לא תומך בפענוח';return}
  err.textContent='פותח…';
  try{const h=await open_(pw.value);
    try{if(document.getElementById('rem').checked)localStorage.setItem('rh-pw',pw.value)}catch(x){}
    start(h)}catch(x){err.textContent='סיסמה שגויה';pw.select()}
}
function logout(){try{localStorage.removeItem('rh-pw')}catch(x){}location.reload()}
(async()=>{let p=null;try{p=localStorage.getItem('rh-pw')}catch(x){}
  if(p){try{start(await open_(p))}catch(x){try{localStorage.removeItem('rh-pw')}catch(y){}}}})();
function start(h){
  document.getElementById('app').innerHTML=h;document.body.classList.add('open');pw.value='';
  const side=document.getElementById('side');
  const secs=[...document.querySelectorAll('section')],links=[...document.querySelectorAll('aside a')];
  function show(id){secs.forEach(s=>s.classList.toggle('active',s.id===id));links.forEach(a=>a.classList.toggle('on',a.dataset.s===id));try{localStorage.setItem('rh-tab',id)}catch(e){}side.classList.remove('open');window.scrollTo(0,0)}
  links.forEach(a=>a.onclick=e=>{e.preventDefault();q.value='';search();show(a.dataset.s)});
  let st=location.hash.slice(1);try{st=st||localStorage.getItem('rh-tab')}catch(e){}
  show(secs.some(s=>s.id===st)?st:secs[0].id);
  document.getElementById('menu').onclick=()=>side.classList.toggle('open');
  const rv=document.getElementById('rv');
  rv.onclick=()=>{const on=document.body.classList.toggle('reveal');rv.classList.toggle('on',on);rv.textContent=on?'🔓 הסתר סיסמאות':'🔒 הצג סיסמאות'};
  document.getElementById('lo').onclick=logout;
  document.addEventListener('click',e=>{const t=e.target.closest('td.sec');if(t)t.classList.toggle('open')});
  const cells=[...document.querySelectorAll('td')];cells.forEach(td=>td.dataset.raw=td.innerHTML);
  const q=document.getElementById('q'),cnt=document.getElementById('cnt');
  const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  function search(){
    const v=q.value.trim(),lv=v.toLowerCase();
    cells.forEach(td=>{if(td.dataset.m){td.innerHTML=td.dataset.raw;delete td.dataset.m}});
    document.querySelectorAll('tr.match,tr.nomatch').forEach(r=>r.classList.remove('match','nomatch'));
    secs.forEach(s=>s.classList.remove('hit'));
    if(!v){document.body.classList.remove('searching');cnt.textContent='';return}
    document.body.classList.add('searching');let n=0;
    secs.forEach(s=>{let hit=false;s.querySelectorAll('tr').forEach((tr,i)=>{
      const ok=i===0||[...tr.cells].some(td=>td.textContent.toLowerCase().includes(lv));
      tr.classList.add(ok?'match':'nomatch');
      if(ok&&i>0){hit=true;n++;[...tr.cells].forEach(td=>{if(!td.querySelector('a')&&td.textContent.toLowerCase().includes(lv)){td.innerHTML=td.textContent.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(new RegExp(esc(v.replace(/[&<>]/g,'')),'gi'),m=>'<mark>'+m+'</mark>');td.dataset.m=1}})}
    });s.classList.toggle('hit',hit)});
    cnt.textContent=n+' תוצאות';
  }
  q.addEventListener('input',search);
  document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}if(e.key==='Escape'){q.value='';search()}});
}
</script>
